<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3c72" />

    <meta
      name="description"
      content="Portfolio of Youssef Fawel, Software Engineer specializing in full-stack systems, AI-assisted applications, and modern web and mobile development."
    />

    <link rel="apple-touch-icon" href="Logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Youssef Fawel | Software Engineer</title>

    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Youssef Fawel",
      "url": "https://yousseffawel.netlify.app",
      "jobTitle": "Software Engineer",
      "description": "Software Engineer specializing in full-stack systems, AI-assisted applications, and modern web and mobile development.",
      "image": "https://yousseffawel.netlify.app/Logo.png"
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <!-- A hidden form for Netlify to detect during build -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
